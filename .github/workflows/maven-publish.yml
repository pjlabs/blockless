# Publish to Maven Central (signed, release profile).
# Central: https://central.sonatype.org/publish/publish-portal-maven/

name: Maven Package

on:
  release:
    types: [published]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    # ~/.m2/settings.xml — Central token + GPG for mvn -P release deploy
    - name: Set up JDK 21 (Maven Central + GPG)
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE
    - name: Set version
      run: mvn --batch-mode versions:set -DnewVersion="$RELEASE_TAG" -DgenerateBackupPoms=false
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
    - name: Publish to Maven Central
      run: mvn -P release --batch-mode clean deploy
      env:
        MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
